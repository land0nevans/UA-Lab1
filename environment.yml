  - geopy=2.3.0
  - hvplot=0.8.2
  - matplotlib=3.8.0
  - mplleaflet=0.0.5
  - openpyxl=3.1.0
  - osmnx=1.5.0
  - owslib=0.27.2
  - pykrige=1.7.0
  - pyrosm=0.7.0
  - pysal=23.1
  - rasterio=1.3.9
  - rasterstats=0.17.0
  - scipy=1.11.0
  - seaborn=0.13.0
  - xarray=2024.2.0
  - xarray_leaflet=0.2.3
  - pyarrow=15.0.0
  
