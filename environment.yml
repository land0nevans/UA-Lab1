name: ua2
# GG4257 python environment updated to June 2026, check GH actions for compatibility issues in future iterations
channels:
  - conda-forge

dependencies:
  - python=3.10

  # Jupyter Lab
  - jupyterlab
  
  # GIS environment - compatible versions
  - contextily
  - folium=0.14.0
